<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilesh Filmi Box - Premium Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        #canvas-container canvas { touch-action: none; cursor: crosshair; }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: slideOut 0.3s ease-in forwards; }
        @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(100%); opacity: 0; } }
    </style>
</head>
<body class="selection:bg-red-500/30 min-h-screen flex flex-col">

    <nav class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('home')">
            <div class="bg-red-600 p-1.5 rounded-lg">
                <i class="fa-solid fa-play text-white"></i>
            </div>
            <span class="text-xl font-black tracking-tight text-white hidden sm:block">
                NILESH FILMI <span class="text-red-500">BOX</span>
            </span>
        </div>

        <div class="flex-1 max-w-xl px-4 hidden md:block">
            <div class="relative">
                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Search movies, anime, cartoons..." class="w-full bg-slate-950 border border-slate-800 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all" onkeyup="handleSearch()">
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-4" id="nav-actions">
            <!-- Nav actions injected via JS -->
        </div>
    </nav>

    <main id="app-content" class="pb-20 flex-1">
        <!-- Dynamic Content Injected Here -->
    </main>

    <!-- Modal for Profile Setup -->
    <div id="profile-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full shadow-2xl">
            <h2 class="text-2xl font-bold mb-2 text-white">Welcome to Nilesh Filmi Box</h2>
            <p class="text-slate-400 text-sm mb-6">Please enter your display name to continue. (Owner must use exact name to gain Admin access).</p>
            <input type="text" id="tempNameInput" placeholder="e.g. Nilesh Rajesh Tiwari" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-red-500 mb-4">
            <button onclick="saveProfile()" id="saveProfileBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition-colors disabled:opacity-50">Enter Platform</button>
            
            <div id="google-login-section">
                <div class="flex items-center gap-4 my-4">
                    <div class="h-px bg-slate-800 flex-1"></div>
                    <span class="text-xs text-slate-500 font-medium">OR</span>
                    <div class="h-px bg-slate-800 flex-1"></div>
                </div>
                <button onclick="handleGoogleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
                    <i class="fa-brands fa-google"></i> Login with Google
                </button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[110] hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl max-w-sm w-full text-center">
            <i class="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-4"></i>
            <h3 class="text-lg font-bold text-white mb-2" id="confirm-title">Are you sure?</h3>
            <p class="text-slate-400 text-sm mb-6" id="confirm-msg">This action cannot be undone.</p>
            <div class="flex gap-3">
                <button onclick="closeConfirm()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white py-2 rounded-lg font-medium transition-colors">Cancel</button>
                <button id="confirm-action-btn" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg font-medium transition-colors">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[120] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot, addDoc, updateDoc, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // =====================================================================
        // 🔥 YAHAN APNA REAL FIREBASE CONFIG DAALEIN (VERY IMPORTANT) 🔥
        // Jab tak aap yahan real details nahi daalenge, website 'Local Mode' 
        // me chalegi aur videos sirf aapko dikhengi!
        // =====================================================================
        const myFirebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Check if running locally or in preview
        const isImmersive = typeof window.__firebase_config !== 'undefined';
        const isLocalMode = !isImmersive && myFirebaseConfig.apiKey === "YOUR_API_KEY";
        const firebaseConfig = isImmersive ? JSON.parse(window.__firebase_config) : (isLocalMode ? { apiKey: "demo-key", projectId: "demo-project", appId: "demo-app" } : myFirebaseConfig);
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'nilesh-filmi-box';
        const ADMIN_NAME = "Nilesh Rajesh Tiwari";
        const CATEGORIES = ['Movies', 'Anime', '3D Cartoons', 'Animal Stories', 'Horror'];

        // Clean Professional State (No Demo Data)
        const INITIAL_VIDEOS = [];

        // Global State
        let state = {
            user: null,
            userData: null,
            videos: INITIAL_VIDEOS,
            currentVideo: null,
            platformData: { totalRevenue: 0, availableBalance: 0 },
            view: 'home', 
            searchQuery: '',
            creatorTab: 'upload',
            adminTab: 'overview',
            isSubscribed: false,
            creatorSubs: 0,
            dataListenersInitialized: false
        };

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800';
            toast.className = `${color} text-white px-4 py-2 rounded-full shadow-lg text-sm font-medium toast-enter flex items-center gap-2`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-circle-xmark' : 'fa-info-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.showConfirm = function(title, msg, onConfirm) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = msg;
            document.getElementById('confirm-modal').classList.remove('hidden');
            document.getElementById('confirm-modal').classList.add('flex');
            const btn = document.getElementById('confirm-action-btn');
            btn.onclick = () => { onConfirm(); closeConfirm(); };
        };

        window.closeConfirm = function() {
            document.getElementById('confirm-modal').classList.add('hidden');
            document.getElementById('confirm-modal').classList.remove('flex');
        };

        const initAuth = async () => {
            try {
                if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                    await signInWithCustomToken(auth, window.__initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth error:", err);
            }
        };

        onAuthStateChanged(auth, (currentUser) => {
            if (!currentUser && isLocalMode) {
                // Enable Offline / Local HTML Demo Mode when downloaded
                state.user = { uid: 'local-admin-123', isAnonymous: false };
                state.userData = { name: ADMIN_NAME, isAdmin: true, wallet: 0, totalViews: 0, photoURL: null };
                state.platformData = { totalRevenue: 0, availableBalance: 0 };
                state.dataListenersInitialized = true;
                renderNavbar();
                render();
                setTimeout(() => showToast("Running in Local Mode. Add Firebase keys to publish globally!", "info"), 2000);
                return;
            }

            state.user = currentUser;
            if (currentUser) {
                if (!state.dataListenersInitialized) {
                    initDataListeners();
                    state.dataListenersInitialized = true;
                }
                checkUserProfile(currentUser);
            } else {
                render();
            }
        });

        const checkUserProfile = async (currentUser) => {
            const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', currentUser.uid);
            onSnapshot(profileRef, async (docSnap) => {
                if (docSnap.exists()) {
                    state.userData = docSnap.data();
                    document.getElementById('profile-modal').classList.add('hidden');
                    document.getElementById('profile-modal').classList.remove('flex');
                } else {
                    if (currentUser.displayName) {
                        await setDoc(profileRef, {
                            name: currentUser.displayName,
                            isAdmin: currentUser.displayName === ADMIN_NAME,
                            createdAt: new Date().toISOString(),
                            wallet: 0,
                            totalViews: 0,
                            photoURL: currentUser.photoURL || null
                        });
                    } else {
                        document.getElementById('profile-modal').classList.remove('hidden');
                        document.getElementById('profile-modal').classList.add('flex');
                        document.getElementById('google-login-section').style.display = currentUser.isAnonymous ? 'block' : 'none';
                    }
                }
                renderNavbar();
                render();
            });
        };

        window.saveProfile = async () => {
            const tempName = document.getElementById('tempNameInput').value;
            if (!state.user || !tempName.trim()) return;
            const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', state.user.uid);
            await setDoc(profileRef, {
                name: tempName,
                isAdmin: tempName === ADMIN_NAME,
                createdAt: new Date().toISOString(),
                wallet: 0,
                totalViews: 0
            });
        };

        window.handleGoogleLogin = async () => {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
            } catch (err) {
                showToast("Google Login failed.", "error");
            }
        };

        const initDataListeners = () => {
            const videosRef = collection(db, 'artifacts', appId, 'public', 'data', 'videos');
            onSnapshot(videosRef, (snapshot) => {
                let fetched = [];
                snapshot.forEach(doc => fetched.push({ id: doc.id, ...doc.data() }));
                // Sort by newest
                fetched.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                state.videos = fetched.length === 0 ? INITIAL_VIDEOS : fetched;
                
                if(state.view !== 'player') render(); 
            });

            const platformRef = doc(db, 'artifacts', appId, 'public', 'data', 'platformStats', 'revenue');
            onSnapshot(platformRef, (docSnap) => {
                if (docSnap.exists()) state.platformData = docSnap.data();
                else setDoc(platformRef, { totalRevenue: 0, availableBalance: 0 });
                if(state.view === 'admin') render();
            });
        };

        window.navigate = (view) => {
            state.view = view;
            try {
                window.history.pushState({}, '', window.location.pathname); 
            } catch (e) {
                // Ignore history block in iframe
            }
            render();
        };

        window.handleSearch = () => {
            state.searchQuery = document.getElementById('searchInput').value;
            if (state.view !== 'home') navigate('home');
            else render();
        };

        const renderNavbar = () => {
            const actions = document.getElementById('nav-actions');
            let html = '';
            
            html += `<button onclick="navigate('creator')" class="hidden sm:flex items-center gap-2 text-sm font-medium text-slate-300 hover:text-white transition-colors bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-full"><i class="fa-solid fa-upload"></i> Upload</button>`;
            
            if (state.userData?.isAdmin) {
                html += `<button onclick="navigate('admin')" class="flex items-center gap-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-full shadow-lg shadow-red-600/20"><i class="fa-solid fa-gear"></i> Admin</button>`;
            }

            if (state.user?.isAnonymous) {
                html += `<button onclick="handleGoogleLogin()" class="flex items-center gap-2 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 px-4 py-1.5 rounded-full shadow-lg shadow-blue-600/20 ml-2"><i class="fa-brands fa-google"></i> <span class="hidden sm:block">Login</span></button>`;
            } else if (state.userData) {
                if (state.userData.photoURL) {
                    html += `<img src="${state.userData.photoURL}" alt="User" class="w-8 h-8 rounded-full border border-slate-700 object-cover ml-2">`;
                } else {
                    html += `<div class="w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center border border-slate-700 text-sm font-bold text-slate-300 ml-2">${state.userData.name ? state.userData.name.charAt(0).toUpperCase() : '<i class="fa-solid fa-user"></i>'}</div>`;
                }
            }
            actions.innerHTML = html;
        };

        const render = () => {
            const container = document.getElementById('app-content');
            window.scrollTo(0, 0);
            if (state.view === 'home') container.innerHTML = getHomeHTML();
            else if (state.view === 'player') container.innerHTML = getPlayerHTML();
            else if (state.view === 'creator') container.innerHTML = getCreatorHTML();
            else if (state.view === 'admin') container.innerHTML = getAdminHTML();
            
            if (state.view === 'creator' && state.creatorTab === 'canvas') initCanvas();
        };

        const getHomeHTML = () => {
            const filtered = state.videos.filter(v => 
                v.title.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                v.category.toLowerCase().includes(state.searchQuery.toLowerCase())
            );

            let html = `<div class="p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto">`;
            
            if (!state.searchQuery && filtered.length > 0) {
                const feat = filtered[0];
                html += `
                <div class="relative w-full h-[40vh] min-h-[300px] rounded-2xl overflow-hidden mb-8 group cursor-pointer" onclick='playVideoObj(${JSON.stringify(feat).replace(/'/g, "&#39;")})'>
                    <img src="${feat.thumbnail}" alt="Featured" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/60 to-transparent flex flex-col justify-end p-6 sm:p-10">
                        <span class="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded w-fit mb-3">FEATURED</span>
                        <h1 class="text-3xl sm:text-5xl font-black text-white mb-2">${feat.title}</h1>
                        <p class="text-slate-300 max-w-2xl text-sm sm:text-base hidden sm:block">${feat.description || 'Watch the best premium content.'}</p>
                    </div>
                </div>`;
            }

            html += `<div class="flex gap-3 overflow-x-auto pb-4 mb-6 scrollbar-hide">`;
            ['All', ...CATEGORIES].forEach(cat => {
                html += `<button onclick="document.getElementById('searchInput').value='${cat === 'All' ? '' : cat}'; handleSearch()" class="whitespace-nowrap px-4 py-2 bg-slate-900 border border-slate-800 rounded-full text-sm font-medium text-slate-300 hover:bg-red-600 hover:text-white hover:border-red-600 transition-all">${cat}</button>`;
            });
            html += `</div>`;

            if (filtered.length === 0) {
                html += `<div class="col-span-full py-20 flex flex-col items-center justify-center text-slate-500">
                    <i class="fa-solid fa-film text-5xl mb-4 opacity-50"></i>
                    <p class="text-lg font-medium">No videos available yet</p>
                    <p class="text-sm">Be the first one to upload!</p>
                </div>`;
            }

            html += `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">`;
            filtered.forEach(v => {
                html += `
                <div class="group cursor-pointer flex flex-col gap-2" onclick='playVideoObj(${JSON.stringify(v).replace(/'/g, "&#39;")})'>
                    <div class="relative aspect-video rounded-xl overflow-hidden bg-slate-900">
                        <img src="${v.thumbnail}" class="w-full h-full object-cover group-hover:opacity-80 transition-opacity">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <i class="fa-solid fa-play text-white text-4xl"></i>
                        </div>
                    </div>
                    <div class="flex gap-3 items-start">
                        <div class="w-9 h-9 rounded-full bg-slate-800 flex-shrink-0 flex items-center justify-center mt-1"><i class="fa-solid fa-user text-slate-400"></i></div>
                        <div class="flex flex-col overflow-hidden">
                            <h3 class="font-semibold text-slate-100 truncate group-hover:text-red-400 transition-colors">${v.title}</h3>
                            <p class="text-xs text-slate-400 truncate">${v.creator}</p>
                            <div class="text-xs text-slate-500 flex items-center gap-1 mt-0.5">
                                <span>${(v.views/1000).toFixed(1)}K views</span> <span>•</span> <span>${v.category}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            html += `</div></div>`;
            return html;
        };

        window.playVideoObj = async (v) => {
            state.currentVideo = v;
            state.view = 'player';
            render();

            const adOverlay = document.getElementById('ad-overlay');
            const mainVideo = document.getElementById('main-video');
            const adTimer = document.getElementById('ad-timer');

            if (adOverlay && mainVideo && adTimer) {
                adOverlay.classList.remove('hidden');
                adOverlay.classList.add('flex');
                mainVideo.pause(); 
                
                let timeLeft = 4; // 4 seconds Ad Overlay
                adTimer.innerText = `Video plays in ${timeLeft}s`;
                
                const adCountdown = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        adTimer.innerText = `Video plays in ${timeLeft}s`;
                    } else {
                        clearInterval(adCountdown);
                        adOverlay.classList.add('hidden');
                        adOverlay.classList.remove('flex');
                        mainVideo.play().catch(e=>console.warn("Auto-play blocked", e));
                    }
                }, 1000);
            }

            // --- REVENUE GENERATION LOGIC ---
            const REVENUE = 10; 
            
            if (isLocalMode) {
                if (v.creator === ADMIN_NAME) {
                     state.platformData.totalRevenue += REVENUE;
                     state.platformData.availableBalance += REVENUE;
                     showToast(`Google Ad Played! ₹${REVENUE} (100%) added to Admin Balance.`, "success");
                } else {
                     state.platformData.totalRevenue += (REVENUE * 0.5);
                     state.platformData.availableBalance += (REVENUE * 0.5);
                     showToast(`Ad Played! 50% to Creator, 50% (₹${REVENUE * 0.5}) to Admin Balance!`, "success");
                }
            } else {
                if (v.id) {
                    const videoRef = doc(db, 'artifacts', appId, 'public', 'data', 'videos', v.id);
                    updateDoc(videoRef, { views: increment(1) }).catch(()=>{});
                    
                    const platformRef = doc(db, 'artifacts', appId, 'public', 'data', 'platformStats', 'revenue');
                    
                    if (v.creator === ADMIN_NAME) {
                        // 100% to Admin Platform
                        showToast(`Google Ad Played! ₹${REVENUE} (100%) added to Platform Balance.`, "success");
                        updateDoc(platformRef, { totalRevenue: increment(REVENUE), availableBalance: increment(REVENUE) }).catch(()=>{});
                    } else if (v.creatorId) {
                        // 50% Creator / 50% Admin Split
                        showToast(`Ad Played! 50% to ${v.creator}, 50% to Platform Balance!`, "success");
                        const creatorRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', v.creatorId);
                        
                        updateDoc(creatorRef, { wallet: increment(REVENUE * 0.5), totalViews: increment(1) }).catch(()=>{});
                        updateDoc(platformRef, { totalRevenue: increment(REVENUE * 0.5), availableBalance: increment(REVENUE * 0.5) }).catch(()=>{});
                    }
                }
            }
            setupPlayerListeners();
        };

        const setupPlayerListeners = () => {
            if(!state.currentVideo || !state.currentVideo.creatorId || isLocalMode) return;
            const creatorRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', state.currentVideo.creatorId);
            onSnapshot(creatorRef, (snap) => {
                if(snap.exists()) {
                    state.creatorSubs = snap.data().subscribersCount || 0;
                    const el = document.getElementById('sub-count-display');
                    if(el) el.innerText = `${state.creatorSubs} Subscribers`;
                }
            });

            if(state.user) {
                const subRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'subscriptions', state.currentVideo.creatorId);
                onSnapshot(subRef, (snap) => {
                    state.isSubscribed = snap.exists();
                    const btn = document.getElementById('sub-btn');
                    if(btn) {
                        btn.innerText = state.isSubscribed ? 'Subscribed' : 'Subscribe';
                        btn.className = state.isSubscribed 
                            ? 'ml-4 font-bold px-4 py-2 rounded-full text-sm transition-colors bg-slate-800 text-slate-300 hover:bg-slate-700' 
                            : 'ml-4 font-bold px-4 py-2 rounded-full text-sm transition-colors bg-white text-black hover:bg-slate-200';
                    }
                });
            }
        };

        window.toggleSubscribe = async () => {
            const v = state.currentVideo;
            if (!state.user || !v.creatorId || state.user.uid === v.creatorId || isLocalMode) return;
            
            const subRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'subscriptions', v.creatorId);
            const creatorRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', v.creatorId);
            const platformRef = doc(db, 'artifacts', appId, 'public', 'data', 'platformStats', 'revenue');

            if (state.isSubscribed) {
                await deleteDoc(subRef);
                await updateDoc(creatorRef, { subscribersCount: increment(-1) });
                showToast("Unsubscribed", "success");
            } else {
                await setDoc(subRef, { subscribedAt: new Date().toISOString() });
                await updateDoc(creatorRef, { subscribersCount: increment(1) });
                showToast("Subscribed! ₹10 generated.", "success");

                const REV = 10; 
                if (v.creator === ADMIN_NAME) {
                    await updateDoc(platformRef, { totalRevenue: increment(REV), availableBalance: increment(REV) });
                } else {
                    await updateDoc(creatorRef, { wallet: increment(REV * 0.5) });
                    await updateDoc(platformRef, { totalRevenue: increment(REV * 0.5), availableBalance: increment(REV * 0.5) });
                }
            }
        };

        window.handleShare = () => {
            const shareUrl = `${window.location.href.split('?')[0]}?v=${state.currentVideo.id}`;
            const ta = document.createElement('textarea');
            ta.value = shareUrl;
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast("Link Copied Successfully!");
            } catch(e) {
                showToast("Error Copying Link", "error");
            }

        window.canvasSave = () => {
            const canvas = document.getElementById('thumbCanvas');
            state.tempThumb = canvas.toDataURL('image/jpeg', 0.8);
            showToast("Canvas saved to thumbnail!");
            setCreatorTab('upload');
        };

        window.setAdminTab = (tab) => { state.adminTab = tab; render(); };
        
        const getAdminHTML = () => {
            const tab = state.adminTab;
            let html = `
            <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                    <div class="flex items-center gap-3">
                        <div class="bg-red-600 p-2 rounded-lg"><i class="fa-solid fa-gear text-white text-xl"></i></div>
                        <div><h1 class="text-3xl font-black text-white">Admin Control Panel</h1><p class="text-red-400 text-sm">Owner (${ADMIN_NAME})</p></div>
                    </div>
                    <div class="flex bg-slate-900 rounded-lg p-1 border border-slate-800">
                        <button onclick="setAdminTab('overview')" class="px-4 py-2 rounded-md text-sm font-medium transition-colors ${tab==='overview'?'bg-red-600 text-white':'text-slate-400'}">Overview</button>
                        <button onclick="setAdminTab('manage')" class="px-4 py-2 rounded-md text-sm font-medium transition-colors ${tab==='manage'?'bg-red-600 text-white':'text-slate-400'}">Manage Videos</button>
                    </div>
                </div>`;

            if (tab === 'overview') {
                html += `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg">
                        <h3 class="text-slate-400 text-xs uppercase font-bold mb-1">Platform Revenue</h3>
                        <p class="text-2xl font-black text-green-400">₹${(state.platformData?.totalRevenue||0).toLocaleString()}</p>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg">
                        <h3 class="text-slate-400 text-xs uppercase font-bold mb-1">Available Balance</h3>
                        <p class="text-2xl font-black text-green-400">₹${(state.platformData?.availableBalance||0).toLocaleString()}</p>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg">
                        <h3 class="text-slate-400 text-xs uppercase font-bold mb-1">Total Videos</h3>
                        <p class="text-2xl font-black text-white">${state.videos.length}</p>
                    </div>
                </div>
                <div class="mt-8 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl max-w-md">
                    <div class="bg-slate-950 p-4 border-b border-slate-800"><h3 class="font-bold text-white"><i class="fa-solid fa-building-columns text-green-500"></i> Withdraw Platform Profits</h3></div>
                    <div class="p-4 space-y-4">
                        <input type="number" id="admin-wd-amt" placeholder="Amount (Max: ₹${state.platformData?.availableBalance||0})" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:border-green-500">
                        
                        <select id="admin-wd-method" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:border-green-500">
                            <option value="Google Pay">Google Pay</option>
                            <option value="PhonePe">PhonePe</option>
                            <option value="UPI">UPI (Other)</option>
                            <option value="Netbanking">Bank Transfer / Netbanking</option>
                        </select>

                        <input type="text" id="admin-wd-details" placeholder="Account / UPI Details" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:border-green-500">
                        
                        <button onclick="adminWithdraw()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition-colors">Transfer to Account</button>
                    </div>
                </div>`;
            } else {
                html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                state.videos.forEach(v => {
                    html += `
                    <div class="flex gap-4 items-center bg-slate-950 p-4 rounded-xl border border-slate-800">
                        <img src="${v.thumbnail}" class="w-24 h-16 object-cover rounded-lg flex-shrink-0">
                        <div class="flex-1 overflow-hidden">
                            <h4 class="font-bold text-slate-200 truncate">${v.title}</h4>
                            <p class="text-xs text-slate-500 mt-0.5">By: ${v.creator}</p>
                        </div>
                        <button onclick="deleteVideo('${v.id}')" class="p-2 bg-slate-800 hover:bg-red-600 text-slate-300 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
                });
                if(state.videos.length === 0) html += `<p class="text-slate-500 col-span-2">No videos on platform.</p>`;
                html += `</div>`;
            }
            html += `</div>`;
            return html;
        };

        window.adminWithdraw = async () => {
            const amt = parseInt(document.getElementById('admin-wd-amt').value);
            const method = document.getElementById('admin-wd-method').value;
            const details = document.getElementById('admin-wd-details').value;

            if(!amt || amt > state.platformData.availableBalance || amt <= 0) { 
                showToast("Invalid amount", "error"); 
                return; 
            }
            if(!details.trim()) {
                showToast("Please enter transfer details", "error");
                return;
            }

            if(!isLocalMode) {
                const platformRef = doc(db, 'artifacts', appId, 'public', 'data', 'platformStats', 'revenue');
                await updateDoc(platformRef, { availableBalance: increment(-amt) });
            } else {
                state.platformData.availableBalance -= amt;
            }
            
            showToast(`Transferred ₹${amt} to Owner via ${method}!`, "success");
            render();
        };

        // Initialize App
        initAuth();
    </script>
</body>
</html>
